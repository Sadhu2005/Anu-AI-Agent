name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: py_compile bin and tests
        run: |
          python -m py_compile bin/*.py tests/*.py tools/*.py

  portable-tests:
    runs-on: ubuntu-latest
    needs: py-compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host deps (PyYAML)
        run: pip install -r requirements.txt
      - name: V0.6.2 regression pack
        run: python tests/run_v0_6_2_regression.py
      - name: V0.6.5 regression pack
        run: |
          if [ -f tests/run_v0_6_5_regression.py ]; then
            python tests/run_v0_6_5_regression.py
          else
            echo "skip: no V0.6.5 pack on this branch"
          fi
