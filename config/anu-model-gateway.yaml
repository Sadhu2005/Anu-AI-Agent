# ANU Model Gateway — OpenAI-compatible provider config (V0.7.1).
# NO API KEYS IN THIS FILE. Use ANU_MODEL_API_KEY or systemd credentials.
# Switch providers by changing base_url + model (+ key elsewhere).
# See docs/MODEL-GATEWAY.md

enabled: true
provider: openai_compatible

# Lab inference: Ollama on Ubuntu anu-server (OpenAI-compatible /v1).
# Router config is preferred when anu-llm-providers.yaml is enabled.
# This single-provider block is the fallback if the router is unavailable.
base_url: "http://192.168.1.13:11434/v1"
model: "qwen2.5-coder:7b"

# Env var name that holds the bearer token (lm-studio / sk-... / etc.)
api_key_env: "ANU_MODEL_API_KEY"
# Optional: if set, read key from this file path (systemd LoadCredential).
api_key_file_env: "ANU_MODEL_API_KEY_FILE"

timeout_seconds: 300
# Completion reserve inside the 65% window. Prompt budget is the router's.
max_tokens: 1536
temperature: 0.2

privacy:
  default_class: INTERNAL
  # Classes that must never be sent to a remote provider.
  forbidden_classes:
    - SECRET

budget:
  max_usd_per_request: 0.05
  max_usd_per_day: 1.0
  # Local LM Studio: treat cost as zero for accounting.
  assume_zero_cost_hosts:
    - "127.0.0.1"
    - "localhost"
    - "192.168."

socket:
  # Agent → gateway (AF_UNIX). Mode 0660; group anu-agent on Pi.
  path: "/run/anu-model/model.sock"
  mode: "0660"
  # SO_PEERCRED: only anu-agent uid/gid (resolved at serve time on Linux).
  require_peercred: true
  allow_user: "anu-agent"
  allow_group: "anu-agent"
  max_request_bytes: 65536

# V0.7.2: optional LLM planning via gateway; template fallback on failure.
planner:
  mode: llm_optional   # llm_optional | template_only
  fallback_template: multi_stage_goal
  max_steps: 4
  timeout_seconds: 180
