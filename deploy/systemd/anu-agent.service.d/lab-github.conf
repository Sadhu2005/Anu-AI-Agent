# Lab-repo autonomy: push agent/* to GitHub using a file-backed PAT.
# Token path must stay root:anu-agent mode 640 under /srv/anu/secrets.
# Relaxes network isolation only enough for HTTPS git (see SECURITY-AUTONOMY.md).
[Service]
Environment=ANU_GITHUB_TOKEN_FILE=/srv/anu/secrets/github-token
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
